[project]
name = "microblog"
version = "2.0.0"
description = "A small, secure Flask blog: Markdown posts, moderated comments with a spam filter, related posts and search. Rebuilt from my 2014 Flask/MongoDB version."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mert Metin" }]
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "markdown-it-py>=3.0",
    "nh3>=0.2",
    "gunicorn>=22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microblog"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
